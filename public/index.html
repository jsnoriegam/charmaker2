<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CharMaker2</title>
  <link rel="stylesheet" href="vendor/normalize.min.css">
  <link rel="stylesheet" href="style.css">
  <script defer src="vendor/alpine.min.js"></script>
</head>
<body x-data="app()" x-init="boot()" x-effect="document.body.style.overflow = anyModalOpen() ? 'hidden' : ''" @keydown.window.escape="closeTopModal()" @keydown.window.left="galleryCompareNav(-1)" @keydown.window.right="galleryCompareNav(1)">

  <div class="shell">
    <aside class="sidebar">
      <button class="sidebar-brand" @click="go('characters')">
        <span class="brand-mark"></span>
        <span class="brand-name">Char Maker v2</span>
      </button>

      <nav class="sidebar-nav">
        <button class="nav-btn" :class="{active: view==='characters' || view==='character'}" @click="go('characters'); detail=null" x-text="t('nav.characters')"></button>
        <button class="nav-btn" :class="{active: view==='gallery'}" @click="go('gallery')" x-text="t('nav.gallery')"></button>
        <button class="nav-btn" :class="{active: view==='framings'}" @click="go('framings')" x-text="t('nav.framings')"></button>
        <button class="nav-btn" :class="{active: view==='accessories'}" @click="go('accessories')" x-text="t('nav.accessories')"></button>
        <button class="nav-btn" :class="{active: view==='globals'}" @click="go('globals')" x-text="t('nav.globals')"></button>
      </nav>

      <div class="sidebar-footer">
        <div id="sd-status" class="status-badge" :class="config && config.sdBinaryExists ? 'ok' : 'err'" x-show="config">
          <span class="status-dot"></span>
          <span x-text="config && (config.sdBinaryExists ? t('status.ready') + (config.rembg.available ? t('status.rembg') : t('status.noRembg')) : t('status.missing'))"></span>
        </div>
        <label class="lang-select">
          <span x-text="t('lang.label')"></span>
          <select x-model="lang" @change="setLang(lang)">
            <template x-for="l in languages" :key="l.code"><option :value="l.code" x-text="l.label"></option></template>
          </select>
        </label>
        <div class="sidebar-actions">
          <button class="btn btn-sm" @click="exportJSON()" x-text="t('sidebar.export')"></button>
          <button class="btn btn-sm" @click="$refs.importFile.click()" x-text="t('sidebar.import')"></button>
          <input type="file" x-ref="importFile" accept="application/json" hidden @change="importJSON($event)">
        </div>
      </div>
    </aside>

    <div class="main-col">
      <main>
        <!-- ============ PERSONAJES: listado ============ -->
        <section x-show="view==='characters'">
          <div class="view-header">
            <h2 x-text="t('characters.title')"></h2>
            <button class="btn btn-primary" @click="openCharModal(null)" x-text="t('characters.new')"></button>
          </div>
          <input
            type="search"
            class="char-search"
            :placeholder="t('characters.search')"
            x-model="charSearch"
          >
          <div class="cards">
            <template x-for="c in filteredCharacters()" :key="c.key">
              <div class="char-card" @click="openCharacter(c.key)">
                <div class="char-avatar" :style="avatarStyle(c)">
                  <span x-show="!avatarStyle(c)" x-text="c.key[0].toUpperCase()"></span>
                </div>
                <div class="char-info">
                  <b x-text="c.key"></b>
                  <span class="muted" x-text="c.identity.slice(0, 70)"></span>
                  <span class="muted small"><span x-text="t('characters.bases', {count: c.bases_count})"></span> · <span x-text="t('characters.variants', {count: c.variants_count})"></span></span>
                </div>
              </div>
            </template>
            <p x-show="!characters.length" class="muted" x-text="t('characters.empty')"></p>
            <p x-show="characters.length && !filteredCharacters().length" class="muted">
              <span x-text="t('characters.noMatch', {query: charSearch})"></span>
            </p>
          </div>
        </section>

        <!-- ============ PERSONAJE: detalle ============ -->
        <section x-show="view==='character' && detail">
          <template x-if="detail">
            <div>
              <div class="view-header">
                <h2><button class="btn btn-sm" @click="view='characters'; loadCharacters()">←</button> <span x-text="detail.key"></span></h2>
                <div class="btn-row">
                  <button class="btn btn-primary" @click="openBaseModal(null)" x-text="t('char.generateBase')"></button>
                  <button class="btn" :class="{ 'btn-primary': detail.bases.some(b=>b.image_path) }"
                          :disabled="!detail.bases.some(b=>b.image_path)"
                          @click="openVariantModal(null)" x-text="t('char.generateVariant')"></button>
                  <a class="btn" :href="bundleUrl()"
                     x-show="detail.bases.some(b=>b.image_path) || detail.variants.some(v=>v.image_path) || detail.inpaints.some(i=>i.image_path)"
                     :title="t('char.downloadBundleTitle')" x-text="t('char.downloadBundle')"></a>
                  <button class="btn btn-danger" @click="confirmDelete(t('confirm.deleteCharacterTitle'), t('char.deleteMsg', {key: detail.key, bases: detail.bases.length, variants: detail.variants.length}), () => deleteCharacter())" x-text="t('char.delete')"></button>
                </div>
              </div>
              <p class="muted" x-show="!detail.bases.some(b=>b.image_path)" x-text="t('char.needBase')"></p>

              <fieldset class="identity-box">
                <legend x-text="t('char.identityLegend')"></legend>
                <div class="editor-grid">
                  <label><span x-text="t('char.lighting')"></span> <input x-model="detail.char.lighting"></label>
                  <label class="full"><span x-text="t('char.identity')"></span> <textarea x-model="detail.char.identity" rows="2"></textarea></label>
                  <label class="full"><span x-text="t('char.face')"></span> <textarea x-model="detail.char.face" rows="2"></textarea></label>
                  <label class="full"><span x-text="t('char.hair')"></span> <textarea x-model="detail.char.hair" rows="1"></textarea></label>
                  <label class="full"><span x-text="t('char.body')"></span> <textarea x-model="detail.char.body" rows="1"></textarea></label>
                  <label class="full"><span x-text="t('char.negativeIdentity')"></span> <textarea x-model="detail.char.negative_identity" rows="2"></textarea></label>
                </div>
                <button class="btn btn-sm btn-primary" @click="saveIdentity()" x-text="t('char.saveIdentity')"></button>
              </fieldset>

              <h3><span x-text="t('char.bases')"></span> <span class="muted" x-text="`(${detail.bases.length})`"></span></h3>
              <div class="cards">
                <template x-for="b in detail.bases" :key="'b'+b.id">
                  <div class="item-card">
                    <div class="item-img" @click="openBaseModal(b)">
                      <img x-show="b.image_path" :src="imgSrc(b.image_path)" loading="lazy">
                      <span x-show="!b.image_path" class="muted" x-text="t('item.notGenerated')"></span>
                    </div>
                    <div class="item-body">
                      <b x-text="t('item.base') + ' ' + b.id"></b>
                      <span class="muted small" x-text="`${b.framing_key} · ${b.steps} steps · cfg ${b.cfg} · seed ${b.seed ?? '—'}`"></span>
                      <span class="muted small ellipsis" x-text="b.clothing"></span>
                    </div>
                    <div class="item-actions">
                      <button class="btn btn-sm" x-text="b.image_path ? t('item.edit') : t('item.generate')" @click="openBaseModal(b)"></button>
                      <button class="btn btn-sm" @click="cloneBase(b.id)" x-text="t('item.clone')"></button>
                      <button class="btn btn-sm btn-danger" @click="confirmDelete(t('confirm.deleteBaseTitle'), t('item.deleteBaseMsg', {id: b.id}), () => deleteBase(b.id))">×</button>
                    </div>
                  </div>
                </template>
              </div>

              <h3><span x-text="t('char.variants')"></span> <span class="muted" x-text="`(${detail.variants.length})`"></span></h3>
              <div class="cards">
                <template x-for="v in detail.variants" :key="'v'+v.id">
                  <div class="item-card">
                    <div class="item-img" @click="openVariantModal(v)">
                      <img x-show="v.image_path" :src="imgSrc(v.image_path)" loading="lazy">
                      <span x-show="!v.image_path" class="muted" x-text="t('item.notGenerated')"></span>
                    </div>
                    <template x-if="inpaintsFor(v.id).length">
                      <div class="inpaint-thumbs">
                        <template x-for="ip in inpaintsFor(v.id)" :key="'ip'+ip.id">
                          <div class="inpaint-thumb" :title="t('item.inpaintHint', {label: ip.label})">
                            <img x-show="ip.image_path" :src="imgSrc(ip.image_path)" loading="lazy" @click.stop="openInpaintModal(v, ip)">
                            <span x-show="!ip.image_path" class="muted small">…</span>
                            <button class="inpaint-del" @click.stop="confirmDelete(t('confirm.deleteInpaintTitle'), t('item.deleteInpaintMsg', {label: ip.label}), () => deleteInpaint(ip.id))" :title="t('common.delete')">×</button>
                          </div>
                        </template>
                      </div>
                    </template>
                    <div class="item-body">
                      <b x-text="v.label || (t('item.variant') + ' ' + v.id)"></b>
                      <span class="muted small" x-text="`${v.framing_key} · ${v.method} · seed ${v.seed ?? '—'}${v.accessories.length ? ' · ' + v.accessories.join(', ') : ''}`"></span>
                      <span class="muted small ellipsis" x-text="v.expression"></span>
                      <span class="muted small ellipsis" x-text="v.clothing"></span>
                    </div>
                    <div class="item-actions">
                      <button class="btn btn-sm" x-text="v.image_path ? t('item.edit') : t('item.generate')" @click="openVariantModal(v)"></button>
                      <button class="btn btn-sm" x-show="v.image_path" @click="openInpaintModal(v)" x-text="t('item.inpaintAction')"></button>
                      <button class="btn btn-sm" @click="cloneVariant(v.id)" x-text="t('item.clone')"></button>
                      <button class="btn btn-sm btn-danger" @click="confirmDelete(t('confirm.deleteVariantTitle'), t('item.deleteVariantMsg', {label: v.label || v.id}), () => deleteVariant(v.id))">×</button>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </template>
        </section>

        <!-- ============ GALERÍA ============ -->
        <section x-show="view==='gallery'">
          <div class="view-header">
            <h2 x-text="t('gallery.title')"></h2>
            <div class="gallery-filters">
              <select x-model="galleryFilter.character">
                <option value="" x-text="t('gallery.allCharacters')"></option>
                <template x-for="k in galleryCharacters()" :key="k"><option :value="k" x-text="k"></option></template>
              </select>
              <div class="chips">
                <button class="chip" :class="{active: !galleryFilter.kind}" @click="galleryFilter.kind=''" x-text="t('gallery.all')"></button>
                <button class="chip" :class="{active: galleryFilter.kind==='base'}" @click="galleryFilter.kind='base'" x-text="t('gallery.bases')"></button>
                <button class="chip" :class="{active: galleryFilter.kind==='variant'}" @click="galleryFilter.kind='variant'" x-text="t('gallery.variants')"></button>
                <button class="chip" :class="{active: galleryFilter.kind==='inpaint'}" @click="galleryFilter.kind='inpaint'" x-text="t('gallery.inpaints')"></button>
              </div>
              <input type="search" class="gallery-search" :placeholder="t('gallery.search')" x-model="galleryFilter.search">
              <select class="gallery-sort" x-model="gallerySort">
                <option value="recent" x-text="t('gallery.sortRecent')"></option>
                <option value="old" x-text="t('gallery.sortOld')"></option>
                <option value="character" x-text="t('gallery.sortCharacter')"></option>
              </select>
              <button class="btn btn-sm" @click="ensureGallery(true)" x-text="t('gallery.refresh')"></button>
            </div>
          </div>
          <p class="muted" x-show="galleryLoading" x-text="t('gallery.loading')"></p>
          <div class="gallery-grid">
            <template x-for="g in galleryFiltered()" :key="g.kind+g.id">
              <div class="gallery-tile" @click="openGalleryItem(g)">
                <img :src="imgSrc(g.image_path)" loading="lazy">
                <span class="gallery-badge" x-text="g.kind"></span>
                <div class="gallery-caption">
                  <b x-text="g.character"></b>
                  <span class="muted small ellipsis" x-text="galleryItemTitle(g)"></span>
                </div>
              </div>
            </template>
          </div>
          <p class="muted" x-show="!galleryLoading && !galleryFiltered().length" x-text="t('gallery.empty')"></p>
        </section>

        <!-- ============ FRAMINGS / ACCESORIOS ============ -->
        <section x-show="view==='framings' || view==='accessories'">
          <div class="view-header">
            <h2 x-text="view==='framings' ? t('coll.framings') : t('coll.accessories')"></h2>
            <button class="btn btn-primary" @click="addCollectionItem(view)" x-text="t('coll.new')"></button>
          </div>
          <table class="coll-table">
            <thead><tr><th style="width:170px" x-text="t('coll.key')"></th><th x-text="t('coll.positive')"></th><th x-text="t('coll.negative')"></th><th style="width:150px"></th></tr></thead>
            <tbody>
              <template x-for="row in (view==='framings' ? framings : accessories)" :key="(view)+row._key">
                <tr>
                  <td><input x-model="row._key" :disabled="!row._isNew"></td>
                  <td><textarea x-model="row.positive" rows="3" @input="row._dirty=true"></textarea></td>
                  <td><textarea x-model="row.negative" rows="3" @input="row._dirty=true"></textarea></td>
                  <td>
                    <button class="btn btn-sm btn-primary" @click="saveCollectionItem(view, row)" x-text="row._isNew ? t('coll.create') : t('coll.save')"></button>
                    <button class="btn btn-sm btn-danger" x-show="!row._isNew" @click="confirmDeleteCollection(row)">×</button>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </section>

        <!-- ============ GLOBALES ============ -->
        <section x-show="view==='globals'">
          <h2 x-text="t('globals.title')"></h2>
          <p class="muted" x-text="t('globals.help')"></p>
          <label><span x-text="t('globals.positive')"></span> <textarea x-model="globals.positive" rows="3"></textarea></label>
          <label><span x-text="t('globals.negative')"></span> <textarea x-model="globals.negative" rows="4"></textarea></label>
          <button class="btn btn-primary" @click="saveGlobals()" x-text="t('globals.save')"></button>
        </section>
      </main>
    </div>
  </div>

  <template x-if="detail">
    <div>
      <datalist id="sug-expressions"><template x-for="s in detail.suggestions.expressions"><option :value="s"></option></template></datalist>
      <datalist id="sug-clothing"><template x-for="s in detail.suggestions.clothing"><option :value="s"></option></template></datalist>
      <datalist id="sug-labels"><template x-for="s in detail.suggestions.labels"><option :value="s"></option></template></datalist>
      <datalist id="sug-negatives"><template x-for="s in detail.suggestions.negatives"><option :value="s"></option></template></datalist>
    </div>
  </template>

  <!-- ============ MODAL: personaje nuevo ============ -->
  <div class="modal-backdrop" x-show="charModal" x-cloak>
    <div class="modal" x-show="charModal" x-transition.opacity role="dialog" aria-modal="true" :aria-label="t('charModal.aria')">
      <template x-if="charModal">
        <div x-init="focusModal($el)">
      <h3 x-text="t('charModal.title')"></h3>
      <label><span x-text="t('charModal.key')"></span> <input x-model="charModal.key" @input="charModal.key = charModal.key.toLowerCase().replace(/[^a-z0-9_]/g,'')" :placeholder="t('charModal.keyPlaceholder')"></label>
      <div class="editor-grid">
        <label><span x-text="t('char.lighting')"></span> <input x-model="charModal.lighting" value="soft natural light"></label>
        <label><span x-text="t('char.body')"></span> <input x-model="charModal.body"></label>
        <label class="full"><span x-text="t('char.identity')"></span> <textarea x-model="charModal.identity" rows="2" :placeholder="t('charModal.identityPlaceholder')"></textarea></label>
        <label class="full"><span x-text="t('char.face')"></span> <textarea x-model="charModal.face" rows="2"></textarea></label>
        <label class="full"><span x-text="t('char.hair')"></span> <textarea x-model="charModal.hair" rows="1"></textarea></label>
        <label class="full"><span x-text="t('charModal.negative')"></span> <textarea x-model="charModal.negative_identity" rows="2"></textarea></label>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" @click="createCharacter()" x-text="t('charModal.create')"></button>
        <button class="btn" @click="charModal=null" x-text="t('charModal.cancel')"></button>
      </div>
        </div>
      </template>
    </div>
  </div>

  <!-- ============ MODAL: base ============ -->
  <div class="modal-backdrop" x-show="baseModal" x-cloak>
    <div class="modal modal-wide" x-show="baseModal" x-transition.opacity role="dialog" aria-modal="true" :aria-label="t('baseModal.aria')" @input="markDirty(baseModal)" @change="markDirty(baseModal)">
      <template x-if="baseModal">
        <div x-init="focusModal($el)">
          <h3 x-text="baseModal.draft.baseId ? t('baseModal.title', {id: baseModal.draft.baseId}) : t('baseModal.new')"></h3>
          <div class="modal-cols">
            <div>
              <label><span x-text="t('baseModal.clothing')"></span>
                <textarea x-model="baseModal.draft.clothing" rows="2" @input="schedulePreview()" :placeholder="t('baseModal.clothingPlaceholder')"></textarea></label>
              <label><span x-text="t('baseModal.negative')"></span>
                <textarea x-model="baseModal.draft.negativeExtra" rows="2" list="sug-negatives" @input="schedulePreview()" :placeholder="t('baseModal.negativePlaceholder')"></textarea></label>
              <label><span x-text="t('common.framing')"></span>
                <select x-model="baseModal.draft.framingKey" @change="schedulePreview()" x-init="$nextTick(() => { $el.value = baseModal.draft.framingKey; })">
                  <template x-for="f in framings"><option :value="f._key" x-text="f._key"></option></template>
                </select></label>
              <fieldset>
                <legend x-text="t('common.settings')"></legend>
                <div class="gen-settings">
                  <label><span x-text="t('common.steps')"></span> <input type="number" x-model.number="baseModal.draft.steps" min="1" max="150"></label>
                  <label><span x-text="t('common.cfg')"></span> <input type="number" step="0.1" x-model.number="baseModal.draft.cfg"></label>
                  <label><span x-text="t('common.sampler')"></span> <select x-model="baseModal.draft.sampler" x-init="$nextTick(() => { $el.value = baseModal.draft.sampler; })">
                    <template x-for="s in samplers"><option :value="s" x-text="s"></option></template>
                  </select></label>
                  <label><span x-text="t('common.schedule')"></span> <select x-model="baseModal.draft.schedule" x-init="$nextTick(() => { $el.value = baseModal.draft.schedule; })"><template x-for="s in schedules"><option :value="s" x-text="s"></option></template></select></label>
                  <label class="full"><span x-text="t('common.model')"></span> <select x-model="baseModal.draft.model" x-init="$nextTick(() => { $el.value = baseModal.draft.model; })"><template x-for="m in models"><option :value="m" x-text="m"></option></template></select></label>
                  <label class="check"><input type="checkbox" x-model="baseModal.draft.seedAuto"> <span x-text="t('baseModal.seedRandom')"></span></label>
                  <label><span x-text="t('common.seed')"></span> <input type="number" x-model="baseModal.draft.seed" :readonly="baseModal.draft.seedAuto"></label>
                  <label class="check full"><input type="checkbox" x-model="baseModal.draft.rembg" :disabled="!config.rembg.available"> <span x-text="t('common.rembg')"></span></label>
                  <p class="muted small full" x-show="!config.rembg.available" style="margin-top:-6px" x-text="t('common.rembgUnavailable')"></p>
                </div>
              </fieldset>
            </div>
            <div class="preview-col">
              <div class="preview-box">
                <h4 x-text="t('gallery.positive')"></h4>
                <p x-text="baseModal.preview.positive || '…'"></p>
                <h4 x-text="t('gallery.negative')"></h4>
                <p x-text="baseModal.preview.negative || '…'"></p>
                <div class="conflicts" x-show="baseModal.conflicts.length">
                  <b x-text="t('common.conflicts')"></b> <span x-text="baseModal.conflicts.join(' · ')"></span>
                </div>
              </div>
              <div class="btn-row">
                <button class="btn btn-primary" :disabled="baseModal.busy" @click="generateBase()"
                        x-text="baseModal.draft.baseId && baseModal.progress.outputPath ? t('common.regenerate') : t('common.generate')"></button>
                <button class="btn" x-show="baseModal.draft.baseId" :disabled="baseModal.busy" @click="saveBaseChanges()" x-text="t('common.saveChanges')"></button>
                <button class="btn btn-danger" x-show="baseModal.busy" @click="cancelJob(baseModal)" x-text="t('common.stop')"></button>
              </div>
              <template x-if="baseModal.progress.status">
                <div class="progress">
                  <div class="stage"><span x-text="t(baseModal.progress.stage || baseModal.progress.status, baseModal.progress.stageParams)"></span><span x-text="`${baseModal.progress.percent}% (${baseModal.progress.currentStep}/${baseModal.progress.totalSteps})`"></span></div>
                  <div class="bar"><div class="bar-fill" :style="`width:${baseModal.progress.percent}%`"></div></div>
                  <div class="error" x-show="baseModal.progress.error" x-text="t(baseModal.progress.error)"></div>
                </div>
              </template>
              <div class="result-img" x-show="baseModal.progress.outputPath">
                <img :src="imgSrc(baseModal.progress.outputPath)" @click="openLightbox(baseModal.progress.outputPath)" :title="t('common.viewOriginal')">
              </div>
            </div>
          </div>
          <div class="btn-row"><button class="btn" @click="closeBaseModal()" x-text="t('common.close')"></button></div>
        </div>
      </template>
    </div>
  </div>

  <!-- ============ MODAL: variante ============ -->
  <div class="modal-backdrop" x-show="variantModal" x-cloak>
    <div class="modal modal-wide" x-show="variantModal" x-transition.opacity role="dialog" aria-modal="true" :aria-label="t('variantModal.aria')" @input="markDirty(variantModal)" @change="markDirty(variantModal)">
      <template x-if="variantModal">
        <div x-init="focusModal($el)">
          <h3 x-text="variantModal.draft.variantId ? t('variantModal.title', {id: variantModal.draft.variantId}) : t('variantModal.new')"></h3>
          <div class="modal-cols">
            <div>
              <label><span x-text="t('variantModal.label')"></span> <input x-model="variantModal.draft.label" list="sug-labels" :placeholder="t('variantModal.labelPlaceholder')"></label>
              <label><span x-text="t('variantModal.baseRef')"></span>
                <select x-model.number="variantModal.draft.baseId" x-init="$nextTick(() => { $el.value = variantModal.draft.baseId; })">
                  <template x-for="b in (detail?.bases || [])">
                    <option :value="b.id" x-text="t('variantModal.baseOption', {id: b.id, noImage: b.image_path ? '' : t('variantModal.noImage'), clothing: (b.clothing || '').slice(0,30)})"></option>
                  </template>
                </select></label>
              <label><span x-text="t('variantModal.expression')"></span>
                <textarea x-model="variantModal.draft.expression" rows="2" list="sug-expressions" @input="schedulePreview()"></textarea></label>
              <label><span x-text="t('variantModal.clothing')"></span>
                <textarea x-model="variantModal.draft.clothing" rows="2" list="sug-clothing" @input="schedulePreview()"></textarea></label>
              <label><span x-text="t('variantModal.negative')"></span>
                <textarea x-model="variantModal.draft.negativeExtra" rows="2" list="sug-negatives" @input="schedulePreview()" :placeholder="t('variantModal.negativePlaceholder')"></textarea></label>
              <label x-text="t('variantModal.accessories')"></label>
              <div class="acc-grid">
                <template x-for="a in accessories">
                  <label class="check"><input type="checkbox" :value="a._key" x-model="variantModal.draft.accessories" @change="schedulePreview()"> <span x-text="a._key"></span></label>
                </template>
              </div>
              <div class="gen-settings">
                <label><span x-text="t('common.framing')"></span>
                  <select x-model="variantModal.draft.framingKey" @change="schedulePreview()" x-init="$nextTick(() => { $el.value = variantModal.draft.framingKey; })">
                    <template x-for="f in framings"><option :value="f._key" x-text="f._key"></option></template>
                  </select></label>
                <label><span x-text="t('variantModal.size')"></span> <select x-model="variantModal.draft.size">
                  <option value="832x1216">832x1216</option><option value="1024x1024">1024x1024</option>
                  <option value="896x1152">896x1152</option><option value="768x1344">768x1344</option>
                  <option value="640x1536">640x1536</option><option value="1216x832">1216x832</option>
                </select></label>
                <label><span x-text="t('variantModal.identity')"></span>
                  <select x-model="variantModal.draft.identityMethod" @change="onMethodChange()">
                    <option value="none" x-text="t('variantModal.methodNone')"></option>
                    <option value="photomaker" :disabled="!config.identityMethods.photomaker" x-text="t('variantModal.methodPhotomaker')"></option>
                    <option value="ipadapter" :disabled="!config.identityMethods.ipadapter" x-text="t('variantModal.methodIpadapter')"></option>
                  </select></label>
                <label x-show="variantModal.draft.identityMethod !== 'none'"><span x-text="t('common.strength')"></span>
                  <input type="number" x-model.number="variantModal.draft.strength"
                    :step="variantModal.draft.identityMethod === 'ipadapter' ? 0.05 : 1"
                    :min="variantModal.draft.identityMethod === 'ipadapter' ? 0.05 : 1"
                    :max="variantModal.draft.identityMethod === 'ipadapter' ? 1 : 100">
                </label>
                <p class="muted small full" x-show="variantModal.draft.identityMethod === 'ipadapter'" x-text="t('variantModal.ipadapterHint')"></p>
                <p class="muted small full" x-show="variantModal.draft.identityMethod === 'photomaker'" x-text="t('variantModal.photomakerHint')"></p>
              </div>
              <fieldset>
                <legend x-text="t('common.settings')"></legend>
                <div class="gen-settings">
                  <label><span x-text="t('common.steps')"></span> <input type="number" x-model.number="variantModal.draft.steps" min="1" max="150"></label>
                  <label><span x-text="t('common.cfg')"></span> <input type="number" step="0.1" x-model.number="variantModal.draft.cfg"></label>
                  <label><span x-text="t('common.sampler')"></span> <select x-model="variantModal.draft.sampler" x-init="$nextTick(() => { $el.value = variantModal.draft.sampler; })">
                    <template x-for="s in samplers"><option :value="s" x-text="s"></option></template>
                  </select></label>
                  <label><span x-text="t('common.schedule')"></span> <select x-model="variantModal.draft.schedule" x-init="$nextTick(() => { $el.value = variantModal.draft.schedule; })"><template x-for="s in schedules"><option :value="s" x-text="s"></option></template></select></label>
                  <label class="full"><span x-text="t('common.model')"></span> <select x-model="variantModal.draft.model" x-init="$nextTick(() => { $el.value = variantModal.draft.model; })"><template x-for="m in models"><option :value="m" x-text="m"></option></template></select></label>
                  <label class="check"><input type="checkbox" x-model="variantModal.draft.seedAuto"> <span x-text="t('variantModal.seedAuto')"></span></label>
                  <label><span x-text="t('common.seed')"></span> <input type="number" x-model="variantModal.draft.seed" :readonly="variantModal.draft.seedAuto"></label>
                  <label class="check full"><input type="checkbox" x-model="variantModal.draft.rembg" :disabled="!config.rembg.available"> <span x-text="t('common.rembg')"></span></label>
                  <p class="muted small full" x-show="!config.rembg.available" style="margin-top:-6px" x-text="t('common.rembgUnavailable')"></p>
                </div>
              </fieldset>
            </div>
            <div class="preview-col">
              <div class="preview-box">
                <h4 x-text="t('gallery.positive')"></h4>
                <p x-text="variantModal.preview.positive || '…'"></p>
                <h4 x-text="t('gallery.negative')"></h4>
                <p x-text="variantModal.preview.negative || '…'"></p>
                <div class="conflicts" x-show="variantModal.conflicts.length">
                  <b x-text="t('common.conflicts')"></b> <span x-text="variantModal.conflicts.join(' · ')"></span>
                </div>
              </div>
              <div class="btn-row">
                <button class="btn btn-primary" :disabled="variantModal.busy" @click="generateVariant()"
                        x-text="variantModal.draft.variantId && variantModal.progress.outputPath ? t('common.regenerate') : t('common.generate')"></button>
                <button class="btn" x-show="variantModal.draft.variantId" :disabled="variantModal.busy" @click="saveVariantChanges()" x-text="t('common.saveChanges')"></button>
                <button class="btn btn-danger" x-show="variantModal.busy" @click="cancelJob(variantModal)" x-text="t('common.stop')"></button>
              </div>
              <template x-if="variantModal.progress.status">
                <div class="progress">
                  <div class="stage"><span x-text="t(variantModal.progress.stage || variantModal.progress.status, variantModal.progress.stageParams)"></span><span x-text="`${variantModal.progress.percent}% (${variantModal.progress.currentStep}/${variantModal.progress.totalSteps})`"></span></div>
                  <div class="bar"><div class="bar-fill" :style="`width:${variantModal.progress.percent}%`"></div></div>
                  <div class="error" x-show="variantModal.progress.error" x-text="t(variantModal.progress.error)"></div>
                </div>
              </template>
              <div class="result-img" x-show="variantModal.progress.outputPath">
                <img :src="imgSrc(variantModal.progress.outputPath)" @click="openLightbox(variantModal.progress.outputPath)" :title="t('common.viewOriginal')">
              </div>
            </div>
          </div>
          <div class="btn-row"><button class="btn" @click="closeVariantModal()" x-text="t('common.close')"></button></div>
        </div>
      </template>
    </div>
  </div>

  <!-- ============ MODAL: inpaint ============ -->
  <div class="modal-backdrop" x-show="inpaintModal" x-cloak>
    <div class="modal modal-wide" x-show="inpaintModal" x-transition.opacity role="dialog" aria-modal="true" :aria-label="t('inpaintModal.aria')" @input="markDirty(inpaintModal)" @change="markDirty(inpaintModal)">
      <template x-if="inpaintModal">
        <div x-init="focusModal($el)">
          <h3 x-text="t('inpaintModal.title', {label: inpaintModal.source.label || inpaintModal.source.id})"></h3>
          <p class="muted small" x-show="inpaintModal.editingId" x-text="t('inpaintModal.editing')">
          </p>
          <div class="modal-cols">
            <div>
              <label><span x-text="t('inpaintModal.region')"></span>
                <select x-model="inpaintModal.draft.region" x-init="$nextTick(() => { $el.value = inpaintModal.draft.region; })">
                  <template x-for="r in (config?.inpaint?.regions || [])"><option :value="r.key" :disabled="!r.available" x-text="t('region.' + r.key)"></option></template>
                </select></label>
              <label><span x-text="t('inpaintModal.label')"></span>
                <input x-model="inpaintModal.draft.label" :placeholder="t('inpaintModal.labelPlaceholder')">
              </label>
              <p class="muted small"><span x-text="t('inpaintModal.willSaveAs')"></span> <b x-text="`${inpaintModal.source.label || t('item.variant')}_${inpaintModal.draft.label || '…'}`"></b></p>
              <label><span x-text="t('inpaintModal.promptLabel')"></span>
                <textarea x-model="inpaintModal.draft.prompt" rows="2" :placeholder="t('inpaintModal.promptPlaceholder')"></textarea></label>
              <label><span x-text="t('inpaintModal.negative')"></span>
                <textarea x-model="inpaintModal.draft.negative" rows="1"></textarea></label>
              <label><span x-text="t('inpaintModal.intensity')"></span> <b x-text="inpaintModal.draft.denoise"></b>
                <input type="range" min="0.05" max="0.95" step="0.05" x-model.number="inpaintModal.draft.denoise"></label>

              <fieldset>
                <legend x-text="t('inpaintModal.identityLegend')"></legend>
                <label><span x-text="t('inpaintModal.mode')"></span>
                  <select x-model="inpaintModal.draft.identityMethod" @change="onInpaintMethodChange()"
                    x-init="$nextTick(() => { $el.value = inpaintModal.draft.identityMethod; })">
                    <option value="none" x-text="t('inpaintModal.modeNone')"></option>
                    <option value="prompt" x-text="t('inpaintModal.modePrompt')"></option>
                    <option value="photomaker" :disabled="!config.identityMethods.photomaker" x-text="t('inpaintModal.modePhotomaker')"></option>
                    <option value="ipadapter" :disabled="!config.identityMethods.ipadapter" x-text="t('inpaintModal.modeIpadapter')"></option>
                  </select>
                </label>
                <p class="muted small" x-show="inpaintModal.draft.identityMethod === 'prompt'" x-text="t('inpaintModal.promptHint')"></p>
                <div class="preview-box" x-show="inpaintModal.draft.identityMethod === 'prompt' && inpaintFinalPrompt()"
                     style="margin-top: 8px;">
                  <h4 x-text="t('inpaintModal.finalPrompt')"></h4>
                  <p x-text="inpaintFinalPrompt()?.positive || '…'"></p>
                  <template x-if="inpaintFinalPrompt()?.negative">
                    <div>
                      <h4 x-text="t('inpaintModal.finalNegative')"></h4>
                      <p x-text="inpaintFinalPrompt()?.negative"></p>
                    </div>
                  </template>
                </div>
                <p class="muted small" x-show="(inpaintModal.draft.identityMethod === 'photomaker' || inpaintModal.draft.identityMethod === 'ipadapter') && !inpaintModal.source.base_id" x-text="t('inpaintModal.noBase')"></p>
                <label x-show="inpaintModal.draft.identityMethod === 'photomaker' || inpaintModal.draft.identityMethod === 'ipadapter'">
                  <span x-text="t('common.strength')"></span> <b x-text="inpaintModal.draft.strength"></b>
                  <input type="range"
                    :min="inpaintModal.draft.identityMethod === 'ipadapter' ? 0.05 : 5"
                    :max="inpaintModal.draft.identityMethod === 'ipadapter' ? 1 : 100"
                    :step="inpaintModal.draft.identityMethod === 'ipadapter' ? 0.05 : 5"
                    x-model.number="inpaintModal.draft.strength">
                </label>
                <p class="muted small" x-show="!config.identityMethods.photomaker && !config.identityMethods.ipadapter" x-text="t('inpaintModal.modelsNotConfigured')"></p>
              </fieldset>

              <label class="check"><input type="checkbox" x-model="inpaintModal.draft.seedAuto"> <span x-text="t('variantModal.seedAuto')"></span></label>
              <label><span x-text="t('common.seed')"></span> <input type="number" x-model="inpaintModal.draft.seed" :readonly="inpaintModal.draft.seedAuto"></label>
              <label class="check"><input type="checkbox" x-model="inpaintModal.draft.rembg" :disabled="!config.rembg.available"> <span x-text="t('common.rembg')"></span></label>
              <p class="muted small" x-show="!config.rembg.available" x-text="t('common.rembgUnavailable')"></p>
            </div>
            <div class="preview-col">
              <div class="btn-row">
                <button class="btn btn-primary" :disabled="inpaintModal.busy" @click="runInpaint()" x-text="t('inpaintModal.generate')"></button>
                <button class="btn" x-show="inpaintModal.editingId" :disabled="inpaintModal.busy" @click="saveInpaintChanges()" x-text="t('common.saveChanges')"></button>
                <button class="btn btn-danger" x-show="inpaintModal.busy" @click="cancelJob(inpaintModal)" x-text="t('common.stop')"></button>
              </div>
              <template x-if="inpaintModal.progress.status">
                <div class="progress">
                  <div class="stage"><span x-text="t(inpaintModal.progress.stage || inpaintModal.progress.status, inpaintModal.progress.stageParams)"></span><span x-text="`${inpaintModal.progress.percent}% (${inpaintModal.progress.currentStep}/${inpaintModal.progress.totalSteps})`"></span></div>
                  <div class="bar"><div class="bar-fill" :style="`width:${inpaintModal.progress.percent}%`"></div></div>
                  <div class="error" x-show="inpaintModal.progress.error" x-text="t(inpaintModal.progress.error)"></div>
                  <div class="error" x-show="inpaintModal.progress.note" x-text="t(inpaintModal.progress.note)"></div>
                </div>
              </template>
              <div class="result-img" x-show="inpaintModal.progress.outputPath">
                <img :src="imgSrc(inpaintModal.progress.outputPath)" @click="openLightbox(inpaintModal.progress.outputPath)" :title="t('common.viewOriginal')">
              </div>
            </div>
          </div>
          <div class="btn-row"><button class="btn" @click="closeInpaintModal()" x-text="t('common.close')"></button></div>
        </div>
      </template>
    </div>
  </div>

  <!-- ============ MODAL: galería ============ -->
  <div class="modal-backdrop" x-show="galleryModal" x-cloak @click.self="closeGalleryModal()">
    <div class="modal modal-wide" x-show="galleryModal" x-transition.opacity>
      <template x-if="galleryModal">
        <div>
          <div class="view-header">
            <h3>
              <span x-text="galleryModal.item.character"></span>
              <span class="muted small" x-text="`· ${galleryModal.item.kind} ${galleryModal.item.id} · ${galleryItemTitle(galleryModal.item)}`"></span>
            </h3>
            <div class="btn-row">
              <a class="btn btn-sm" :href="galleryModal.item.image_path" :download="galleryDownloadName(galleryModal.item)" x-text="t('gallery.download')"></a>
              <button class="btn btn-sm" @click="closeGalleryModal()" x-text="t('gallery.close')"></button>
            </div>
          </div>
          <div class="gallery-modal-cols">
            <div class="gallery-compare">
              <figure>
                <img
                  :src="imgSrc(galleryModal.showOriginal && galleryModal.item.origin ? galleryModal.item.origin.image_path : galleryModal.item.image_path)"
                  loading="lazy"
                  @click="openLightbox(galleryModal.showOriginal && galleryModal.item.origin ? galleryModal.item.origin.image_path : galleryModal.item.image_path)">
                <figcaption x-text="galleryModal.showOriginal && galleryModal.item.origin ? t('gallery.origin', {title: galleryOriginTitle(galleryModal.item)}) : (galleryModal.item.origin ? t('gallery.generatedImage') : '')"></figcaption>
              </figure>
              <button
                class="gallery-compare-btn next"
                x-show="galleryModal.item.origin && !galleryModal.showOriginal"
                :title="t('gallery.viewOriginal')"
                @click="galleryModal.showOriginal = true">❯</button>
              <button
                class="gallery-compare-btn prev"
                x-show="galleryModal.item.origin && galleryModal.showOriginal"
                :title="t('gallery.backGenerated')"
                @click="galleryModal.showOriginal = false">❮</button>
            </div>
            <div class="preview-box gallery-props">
              <p class="muted small" x-show="galleryModal.loading" x-text="t('gallery.loadingPrompt')"></p>
              <div x-show="!galleryModal.loading">
                <h4 x-text="t('gallery.positive')"></h4>
                <p x-text="galleryModal.item.prompts?.positive || '—'"></p>
                <h4 x-text="t('gallery.negative')"></h4>
                <p x-text="galleryModal.item.prompts?.negative || '—'"></p>
                <template x-if="galleryModal.item.kind === 'inpaint'">
                  <div>
                    <h4 x-text="t('gallery.originalForm')"></h4>
                    <p x-text="galleryModal.item.meta.prompt || '—'"></p>
                    <h4 x-text="t('gallery.scenePrompt')"></h4>
                    <p x-text="galleryModal.item.scene?.positive || '—'"></p>
                  </div>
                </template>
              </div>
              <h4 x-text="t('gallery.settings')"></h4>
              <table class="prop-table">
                <template x-for="row in galleryMetaRows(galleryModal.item)" :key="row[0]">
                  <tr><td x-text="row[0]"></td><td x-text="row[1]"></td></tr>
                </template>
              </table>
            </div>
          </div>
        </div>
      </template>
    </div>
  </div>

  <!-- ============ MODAL: confirmación ============ -->
  <div class="modal-backdrop confirm" x-show="confirmModal" x-cloak @click.self="confirmModal=null">
    <div class="modal">
      <h3 x-text="confirmModal?.title"></h3>
      <p x-text="confirmModal?.message"></p>
      <div class="btn-row">
        <button class="btn" :class="confirmModal?.confirmClass || 'btn-danger'" @click="runConfirm()" x-text="confirmModal?.confirmLabel || t('confirm.confirm')"></button>
        <button class="btn" x-show="confirmModal && confirmModal.hasDiscard" @click="runDiscard()" x-text="confirmModal?.discardLabel || t('confirm.discard')"></button>
        <button class="btn" @click="confirmModal=null" x-text="t('confirm.cancel')"></button>
      </div>
    </div>
  </div>

  <!-- ============ JOBS ACTIVOS (bandeja flotante) ============ -->
  <div id="active-jobs" x-show="activeJobs.length || finishedJobs.length" x-cloak>
    <div class="jobs-head">
      <b x-text="t('jobs.title')"></b>
      <button class="job-chip-cancel" x-show="finishedJobs.length" @click="finishedJobs = []" :title="t('jobs.clearTitle')" x-text="t('jobs.clear')"></button>
    </div>
    <template x-for="job in activeJobs" :key="job.jobId">
      <div class="job-chip">
        <div class="job-chip-head">
          <span class="job-chip-label" x-text="job.label"></span>
          <button class="job-chip-cancel" @click="cancelActiveJob(job)" :title="t('jobs.stopTitle')">×</button>
        </div>
        <div class="job-chip-stage">
          <span x-text="job.status === 'pending' ? (job.queuePosition ? t('jobs.queuedN', {n: job.queuePosition}) : t('jobs.queued')) : t(job.stage || job.status, job.stageParams)"></span>
          <span x-text="`${job.percent ?? 0}%`"></span>
        </div>
        <div class="bar"><div class="bar-fill" :style="`width:${job.percent || 0}%`"></div></div>
        <div class="job-chip-error" x-show="job.error" x-text="t(job.error)"></div>
      </div>
    </template>
    <template x-for="job in finishedJobs" :key="'f'+job.jobId">
      <div class="job-chip" :class="job.status === 'done' ? 'is-done' : 'is-failed'">
        <div class="job-chip-head">
          <span class="job-chip-label" x-text="job.label"></span>
          <button class="job-chip-cancel" @click="finishedJobs = finishedJobs.filter(j => j.jobId !== job.jobId)" :title="t('jobs.removeTitle')">×</button>
        </div>
        <div class="job-chip-stage" x-text="job.status === 'done' ? t('jobs.done') : (job.status === 'cancelled' ? t('jobs.cancelled') : t('jobs.error'))"></div>
      </div>
    </template>
  </div>

  <div id="toast" x-show="toastMsg" x-cloak :class="toastKind" role="status" aria-live="polite" x-text="toastMsg" @click="toastMsg=''"></div>

  <!-- ============ LIGHTBOX (imagen original) ============ -->
  <div class="lightbox" x-show="lightbox" x-cloak @click="lightbox = null" :title="t('common.lightboxHint')">
    <img :src="lightbox" @click.stop @load="lightboxDims = $el.naturalWidth + '×' + $el.naturalHeight">
    <p class="muted small" style="position:fixed;top:10px;right:16px;color:#ddd" x-text="lightboxDims" x-show="lightboxDims"></p>
  </div>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
